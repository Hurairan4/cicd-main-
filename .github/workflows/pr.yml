name: Create Pull Request

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: gh pr create --base main --head dev --title "Auto Pull Request from dev to main" --body "This PR was created automatically by GitHub Actions."
